<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080b12" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http: https:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>AndroDash</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-busy="true">
      <div class="boot-screen">
        <div class="brand-mark brand-mark-large" aria-hidden="true"></div>
        <p class="boot-wordmark">AndroDash</p>
        <p class="boot-message">Preparing your wall</p>
        <div class="boot-track"><span></span></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>
      <div class="noscript-card">AndroDash needs JavaScript enabled to render dashboards.</div>
    </noscript>
  </body>
</html>
